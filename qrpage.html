<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaVault 预览 - 二维码</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1c1c1e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    .subtitle {
      color: rgba(255,255,255,0.6);
      margin-bottom: 40px;
    }
    .qr-container {
      background: #fff;
      padding: 30px;
      border-radius: 24px;
      margin-bottom: 40px;
    }
    .instructions {
      background: #2c2c2e;
      padding: 24px;
      border-radius: 16px;
      max-width: 400px;
      text-align: left;
    }
    .instructions h3 {
      margin-bottom: 16px;
      font-size: 18px;
    }
    .instructions ol {
      margin-left: 20px;
      line-height: 1.8;
    }
    .highlight {
      color: #0a84ff;
      font-weight: 600;
    }
    .note {
      margin-top: 20px;
      padding: 16px;
      background: rgba(255,170,0,0.15);
      border-radius: 12px;
      font-size: 14px;
      color: #ffa500;
    }
  </style>
</head>
<body>

  <h1>📱 MediaVault 预览</h1>
  <p class="subtitle">iPhone UI 设计预览 - 请扫描下方二维码</p>

  <div class="qr-container">
    <img src="preview.png" alt="二维码" width="250" height="250">
  </div>

  <div class="instructions">
    <h3>📋 使用说明</h3>
    <ol>
      <li>截图保存此页面</li>
      <li>用微信或其他扫码工具<strong>扫描二维码</strong></li>
      <li>点击打开链接查看预览效果</li>
    </ol>
  </div>

  <div class="note">
    ⚠️ 由于这是本地文件预览，需要先下载 <code>preview.html</code> 文件到手机本地后打开
  </div>

</body>
</html>
