<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c542"/>
      <stop offset="100%" style="stop-color:#e8a020"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Vault door frame -->
  <rect x="86" y="76" width="340" height="340" rx="40" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.8"/>
  
  <!-- Vault door inner frame -->
  <rect x="106" y="96" width="300" height="300" rx="28" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>

  <!-- Vault handle / Vinyl record as dial -->
  <circle cx="256" cy="246" r="110" fill="none" stroke="url(#gold)" stroke-width="20" opacity="0.9"/>
  <circle cx="256" cy="246" r="88" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12"/>
  <circle cx="256" cy="246" r="72" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>
  <circle cx="256" cy="246" r="56" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.06"/>
  
  <!-- Center cross / vault handle -->
  <rect x="246" y="206" width="20" height="80" rx="4" fill="url(#gold)" opacity="0.85"/>
  <rect x="216" y="236" width="80" height="20" rx="4" fill="url(#gold)" opacity="0.85"/>
  
  <!-- Center circle -->
  <circle cx="256" cy="246" r="18" fill="#0f0f1a"/>
  <circle cx="256" cy="246" r="16" fill="none" stroke="url(#gold)" stroke-width="2"/>

  <!-- Vault bolts (left side) -->
  <circle cx="116" cy="180" r="10" fill="url(#gold)" opacity="0.7"/>
  <circle cx="116" cy="246" r="10" fill="url(#gold)" opacity="0.7"/>
  <circle cx="116" cy="312" r="10" fill="url(#gold)" opacity="0.7"/>

  <!-- Vault bolts (right side) -->
  <circle cx="396" cy="180" r="10" fill="url(#gold)" opacity="0.7"/>
  <circle cx="396" cy="246" r="10" fill="url(#gold)" opacity="0.7"/>
  <circle cx="396" cy="312" r="10" fill="url(#gold)" opacity="0.7"/>

  <!-- Film frame icon at top -->
  <rect x="216" y="52" width="80" height="52" rx="6" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.7"/>
  <polygon points="246,68 246,94 268,81" fill="url(#gold)" opacity="0.7"/>

  <!-- Text -->
  <text x="256" y="460" text-anchor="middle" font-family="-apple-system, SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="700" fill="url(#gold)" letter-spacing="6">MEDIAVAULT</text>
</svg>
