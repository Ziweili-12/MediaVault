<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Outer circle -->
  <circle cx="256" cy="210" r="145" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.1"/>

  <!-- Play triangle (center) -->
  <polygon points="218,152 218,268 322,210" fill="url(#accent)" opacity="0.95"/>

  <!-- Vinyl grooves -->
  <circle cx="256" cy="210" r="130" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.06"/>
  <circle cx="256" cy="210" r="115" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.08"/>
  <circle cx="256" cy="210" r="100" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.1"/>
  <circle cx="256" cy="210" r="85" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.2"/>
  <circle cx="256" cy="210" r="70" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.15"/>
  <circle cx="256" cy="210" r="55" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.12"/>

  <!-- Thin separator -->
  <line x1="160" y1="385" x2="352" y2="385" stroke="url(#accent)" stroke-width="1" opacity="0.25"/>

  <!-- Title - monospace tech feel -->
  <text x="256" y="430" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="40" font-weight="400" fill="#ffffff" letter-spacing="12" opacity="0.9">MEDIA</text>
  <text x="256" y="472" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="40" font-weight="400" fill="url(#accent)" letter-spacing="12" opacity="0.95">VAULT</text>
</svg>
